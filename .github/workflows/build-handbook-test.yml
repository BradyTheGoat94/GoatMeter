name: Build handbook test candidates
on:
  push:
    branches: [labs/goatsim-rankings-updater-20261016]
    paths: ['website/**', 'tests/builds/**', 'labs/goatsim/**', 'tests/goatsim/**', '.github/workflows/build-handbook-test.yml']
  workflow_dispatch:
jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check website/builds/app.js
      - run: node --test tests/builds/*.test.mjs tests/goatsim/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests/builds -p "test_*.py"
      - uses: actions/upload-artifact@v4
        with:
          name: GoatMeter-Build-Lab-test-only
          path: website/
          retention-days: 14
