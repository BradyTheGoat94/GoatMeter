name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**", "installer/**", ".github/workflows/build-windows.yml"]
  push:
    branches: [main, accuracy-reliability, identity-reports, overlay-designs, 'test/goatsim-integration', 'test/beta-updater']
    paths: ["src/**", "tests/**", "installer/**", ".github/workflows/build-windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    env:
      UpdateChannel: ${{ github.ref == 'refs/heads/test/beta-updater' && 'Beta' || 'Stable' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Combat and protocol regression checks
        run: dotnet run --project tests/Regression.csproj -c Release
      - name: GoatSim prototype regression checks
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_goatsim_*.py'
      - name: Protocol and updater regression tests
        run: dotnet test tests/Aion2DPSPro.Tests.csproj -c Release
      - name: Restore
        run: dotnet restore src/Aion2DPSPro.csproj
      - name: WPF overlay smoke checks
        run: dotnet run --project tests/OverlaySmoke/OverlaySmoke.csproj -c Release
      - name: Upload report preview
        uses: actions/upload-artifact@v4
        with:
          name: combat-report-preview
          path: report-preview.png
          if-no-files-found: error
      - name: Publish Windows x64
        run: dotnet publish src/Aion2DPSPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish -p:Version=1.0.${{ github.run_number }}
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GoatMeter-win-x64
          path: publish/
          if-no-files-found: error


      - name: Upload overlay previews
        uses: actions/upload-artifact@v4
        with:
          name: overlay-style-previews
          path: overlay-*.png
          if-no-files-found: error

      - name: Build guided Windows installer
        shell: pwsh
        run: |
          $env:GOATMETER_VERSION = "1.0.${{ github.run_number }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/GoatMeter.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path dist/GoatMeter-Setup.exe)) { throw "Installer missing" }
          Compress-Archive -Path publish/* -DestinationPath dist/GoatMeter-win-x64.zip
          Get-FileHash dist/GoatMeter-Setup.exe, dist/GoatMeter-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - name: Verify installer upgrade preserves user data
        if: github.ref == 'refs/heads/test/beta-updater'
        shell: pwsh
        env:
          GOATMETER_VERSION: 1.0.${{ github.run_number }}
        run: ./tests/InstallerUpgrade.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GoatMeter-Setup
          path: dist/
          if-no-files-found: error
      - name: Publish public download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "goatmeter-build-${{ github.run_number }}"
          gh release create $tag dist/GoatMeter-Setup.exe dist/GoatMeter-win-x64.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "GoatMeter $env:GITHUB_RUN_NUMBER" --notes "Windows x64 installer and portable ZIP. Installer guides Npcap setup; Npcap is downloaded separately from its official site." --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }

      - name: Publish opt-in updater beta
        if: github.event_name == 'push' && github.ref == 'refs/heads/test/beta-updater'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "goatmeter-beta-${{ github.run_number }}"
          @'
          Windows x64 public beta with in-app installer updates.

          Install this version once to enable beta-channel updates. Afterwards GoatMeter checks at startup and every six hours, offers newer compatible beta or stable releases, downloads the installer and verifies its SHA-256 checksum. Installation requires your confirmation and waits for fight history to finish saving.

          Existing beta 218 only checks stable releases and cannot discover this beta automatically. Download GoatMeter-Setup.exe once to upgrade. Installed users retain their settings and fight history. Portable users are migrated to the standard installed app when they accept an installer update.

          Combat and roster behavior remains based on the previously tested build 218. The separate experimental party-filter changes are not included. Party metadata can remain unavailable until supported roster packets arrive.

          Stable users remain on the stable update channel. This release is marked as a prerelease and does not replace the stable download.
          '@ | Set-Content beta-notes.md
          gh release create $tag dist/GoatMeter-Setup.exe dist/GoatMeter-win-x64.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "GoatMeter 1.0.${{ github.run_number }} Beta" --notes-file beta-notes.md --prerelease --latest=false --draft
          if ($LASTEXITCODE -ne 0) { throw 'Beta draft creation failed' }
          gh release edit $tag --draft=false --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Beta publication failed' }
