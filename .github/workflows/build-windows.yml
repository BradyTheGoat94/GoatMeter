name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**", "installer/**", ".github/workflows/build-windows.yml"]
  push:
    branches: [main, accuracy-reliability, identity-reports, overlay-designs, 'testing/**']
    paths: ["src/**", "tests/**", "installer/**", ".github/workflows/build-windows.yml"]

concurrency:
  group: goatmeter-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Combat and protocol regression checks
        run: dotnet run --project tests/Regression.csproj -c Release
      - name: Restore
        run: dotnet restore src/Aion2DPSPro.csproj
      - name: WPF overlay smoke checks
        run: dotnet run --project tests/OverlaySmoke/OverlaySmoke.csproj -c Release
      - name: Upload report preview
        uses: actions/upload-artifact@v4
        with:
          name: combat-report-preview
          path: report-preview.png
          if-no-files-found: error
      - name: Publish Windows x64
        run: dotnet publish src/Aion2DPSPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GoatMeter-win-x64
          path: publish/
          if-no-files-found: error


      - name: Upload overlay previews
        uses: actions/upload-artifact@v4
        with:
          name: overlay-style-previews
          path: overlay-*.png
          if-no-files-found: error

      - name: Build guided Windows installer
        shell: pwsh
        run: |
          $env:GOATMETER_VERSION = "1.0.${{ github.run_number }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/GoatMeter.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path dist/GoatMeter-Setup.exe)) { throw "Installer missing" }
          Compress-Archive -Path publish/* -DestinationPath dist/GoatMeter-win-x64.zip
          Get-FileHash dist/GoatMeter-Setup.exe, dist/GoatMeter-win-x64.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content dist/SHA256SUMS.txt
      - name: Verify distribution archives and checksums
        shell: pwsh
        run: |
          $zip = "dist/GoatMeter-win-x64.zip"
          $setup = "dist/GoatMeter-Setup.exe"
          $manifest = "dist/SHA256SUMS.txt"
          foreach ($file in @($zip, $setup, $manifest)) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing or empty distribution file: $file" }
          }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip).Path)
          try {
            if (!($archive.Entries | Where-Object { $_.FullName -eq 'GoatMeter.exe' })) {
              throw "Portable archive does not contain GoatMeter.exe"
            }
          } finally { $archive.Dispose() }
          $lines = Get-Content $manifest
          foreach ($file in @($setup, $zip)) {
            $name = [IO.Path]::GetFileName($file)
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if (!($lines | Where-Object { $_ -eq "$actual  $name" })) {
              throw "Checksum mismatch for $name"
            }
          }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GoatMeter-Setup
          path: dist/
          if-no-files-found: error
      - name: Publish public download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "goatmeter-build-${{ github.run_number }}"
          gh release create $tag dist/GoatMeter-Setup.exe dist/GoatMeter-win-x64.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "GoatMeter $env:GITHUB_RUN_NUMBER" --notes "Windows x64 installer and portable ZIP. Installer guides Npcap setup; Npcap is downloaded separately from its official site." --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
