name: Fight archive testing (no deployment)
on:
  workflow_dispatch:
  pull_request:
    paths: ['leaderboard/**', 'src/Sharing/FightLogExport.cs', '.github/workflows/fight-archive-tests.yml']
  push:
    branches: [feature/fight-log-leaderboards-mvp]
    paths: ['leaderboard/**', 'src/Sharing/FightLogExport.cs', '.github/workflows/fight-archive-tests.yml']
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test leaderboard/api.test.mjs leaderboard/server.test.mjs
      - run: node leaderboard/build.mjs
